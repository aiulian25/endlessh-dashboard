# Run through ./e2e/run.sh: unique project/image and ephemeral loopback ports.
services:
  tarpit:
    image: ${E2E_EXPORTER_IMAGE:?Run through e2e/run.sh}
    command:
      - -logtostderr
      - -v=1
      - -prometheus_enabled
      - -geoip_supplier=off
      - -prometheus_port=2112
    ports:
      - "127.0.0.1::2222"
      - "127.0.0.1::2112"
    networks:
      - e2e

  dashboard:
    image: ${E2E_DASHBOARD_IMAGE:?Run through e2e/run.sh}
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - tarpit
    environment:
      LISTEN_ADDR: ":18222"
      DATA_DIR: /data
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: e2e-seed-password
      # The suite talks plain HTTP to 127.0.0.1, so the Secure flag has to stay
      # off or the browser-shaped client in smoke_test.go would drop the session
      # cookie and every authenticated call after login would 401. Pinned rather
      # than left to the auto default, so a change to that default surfaces in
      # the config tests where it belongs and not as a mystery here.
      SECURE_COOKIES: "off"
      SCRAPE_INTERVAL: 5s
      SCRAPE_BLOCK_PRIVATE: "false"
      BACKUP_DAILY: "false"
      TZ: UTC

      # Pin both enrichment sources off independently of application defaults.
      GEOIP_ONLINE: "false"
      GEOIP_MMDB_PATH: ""
    ports:
      - "127.0.0.1::18222"
    read_only: true
    # tmpfs, world-writable so the nonroot uid can create the database: every run starts clean
    tmpfs:
      - /data:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - e2e

networks:
  e2e: {}
